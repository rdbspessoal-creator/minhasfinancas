<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minhas Finanças</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Minhas Finanças</h1>
  </header>

  <main>
    <section class="resumo" id="resumo">
      <div class="card receita">
        <span>Receitas</span>
        <strong id="totalReceitas">R$ 0,00</strong>
      </div>
      <div class="card despesa">
        <span>Despesas</span>
        <strong id="totalDespesas">R$ 0,00</strong>
      </div>
      <div class="card saldo">
        <span>Saldo</span>
        <strong id="totalSaldo">R$ 0,00</strong>
      </div>
    </section>

    <section class="formulario">
      <h2>Nova transação</h2>
      <form id="formTransacao">
        <input type="text" id="descricao" placeholder="Descrição" required />
        <input type="number" id="valor" placeholder="Valor" step="0.01" min="0.01" required />
        <select id="tipo" required>
          <option value="receita">Receita</option>
          <option value="despesa">Despesa</option>
        </select>
        <select id="categoria"></select>
        <input type="date" id="data" required />
        <button type="submit">Adicionar</button>
      </form>
    </section>

    <section class="lista">
      <h2>Transações</h2>
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Descrição</th>
            <th>Categoria</th>
            <th>Tipo</th>
            <th>Valor</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="corpoTabela"></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
